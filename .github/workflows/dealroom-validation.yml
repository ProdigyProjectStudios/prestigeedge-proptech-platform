name: Prestige Edge CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/dealroom-durable-security-foundation
      - feat/dealroom-dropbox-sign

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Deal Room HTTP, authorization, and provider-signature tests
        run: npm run test:dealroom
      - name: Type-check Dropbox Sign service and callback verification
        run: npx tsc --noEmit --skipLibCheck --target es2022 --module esnext --moduleResolution bundler --esModuleInterop --types node server/dealroom/dropbox-sign.ts server/dealroom/dropbox-callback.ts tests/dealroom-dropbox.test.ts tests/dealroom-dropbox-callback.test.ts
      - name: Production client/server build
        run: npm run build

  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: prestigeedge_ci
        options: >-
          --health-cmd "pg_isready -U postgres -d prestigeedge_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply both migrations twice, check constraints in disposable PostgreSQL
        env:
          PG_SERVICE: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker cp migrations/20261030_dealroom_foundation.sql "$PG_SERVICE:/tmp/foundation.sql"
          docker cp migrations/20261030_dealroom_signatures.sql "$PG_SERVICE:/tmp/signatures.sql"
          docker cp tests/sql/dealroom-migration-smoke.sql "$PG_SERVICE:/tmp/smoke.sql"
          docker exec "$PG_SERVICE" psql -U postgres -d prestigeedge_ci -v ON_ERROR_STOP=1 -c 'CREATE TABLE users (id uuid PRIMARY KEY)'
          for cycle in 1 2; do
            docker exec "$PG_SERVICE" psql -U postgres -d prestigeedge_ci -v ON_ERROR_STOP=1 -f /tmp/foundation.sql
            docker exec "$PG_SERVICE" psql -U postgres -d prestigeedge_ci -v ON_ERROR_STOP=1 -f /tmp/signatures.sql
          done
          docker exec "$PG_SERVICE" psql -U postgres -d prestigeedge_ci -v ON_ERROR_STOP=1 -f /tmp/smoke.sql
