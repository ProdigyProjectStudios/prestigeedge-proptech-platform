name: Deal Room foundation
on:
  pull_request:
    paths:
      - "server/dealroom/**"
      - "shared/schema.ts"
      - "server/index.ts"
      - "package.json"
      - "package-lock.json"
      - "tests/dealroom-*.test.ts"
      - ".github/workflows/dealroom-validation.yml"
  push:
    branches:
      - "feat/dealroom-durable-security-foundation"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test:dealroom
      - run: npm run build
