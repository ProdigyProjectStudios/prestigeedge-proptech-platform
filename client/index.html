<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>PrestigeEdge - Luxury Real Estate</title>
    <meta name="description" content="Premium luxury real estate platform featuring exclusive properties, mansions, penthouses, and estates. Professional agents, virtual tours, and personalized luxury property services." />
    <meta name="keywords" content="luxury real estate, premium properties, mansion, penthouse, estate, villa, luxury homes" />
    <meta name="author" content="PrestigeEdge" />
    <link rel="canonical" href="https://prestigeedge.replit.app" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PrestigeEdge - Luxury Real Estate" />
    <meta property="og:description" content="Premium luxury real estate platform featuring exclusive properties, mansions, penthouses, and estates." />
    <meta property="og:site_name" content="PrestigeEdge" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PrestigeEdge - Luxury Real Estate" />
    <meta name="twitter:description" content="Premium luxury real estate platform featuring exclusive properties, mansions, penthouses, and estates." />
    
    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.pexels.com" />
    
    <!-- Theme -->
    <meta name="theme-color" content="#D4AF37" />
    
    <!-- Immediate dark background to prevent white flash -->
    <style>
      html, body {
        background: #0a0a0a;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
